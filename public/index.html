<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Política de segurança: só código do próprio site; conexões só com o Supabase.
     Se o projeto usar domínio próprio no Supabase, acrescente-o em connect-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1110">
<title>Erbe · Central</title>
<meta name="description" content="Erbe Proteção e Patrimônio — carteira, comissionamento e agenda.">
<!-- Sistema interno: não deve aparecer em buscadores. -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Erbe">
<link rel="preload" href="assets/fonts/sora-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css">
<!-- config.js traz o endereço e a chave PÚBLICA (anon) do Supabase. Precisa vir antes do código. -->
<script src="config.js"></script>
<!-- supabase-js servido do próprio site (vendor/): sem dependência de CDN de terceiros. -->
<script src="vendor/supabase.js"></script>
</head>
<body>
<noscript><div class="noscript">O Erbe · Central precisa de JavaScript ligado para funcionar.</div></noscript>

<div id="carregando" role="status" aria-live="polite">
  <div class="carregando-cx"><span class="spinner" aria-hidden="true"></span><span>Carregando o Erbe · Central…</span></div>
</div>
<div id="login" hidden></div>
<div id="app" hidden>
  <aside id="rail">
    <div class="brand">
      <div id="marcaSimbolo" data-marca aria-hidden="true"></div>
      <div>
        <div class="brand-name">ERBE</div>
        <div class="brand-sub">Proteção e Patrimônio</div>
      </div>
    </div>
    <nav id="nav" aria-label="Navegação principal"></nav>
    <div id="rail-foot">
      <div class="avatar" id="meAv" aria-hidden="true">—</div>
      <div class="rail-user"><b id="meName">Carregando…</b><span id="meRole"></span></div>
      <button class="icon-btn" id="instalarBtn" data-act="instalarApp" title="Instalar como aplicativo" aria-label="Instalar como aplicativo" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="icon-btn" data-act="sair" title="Sair da conta" aria-label="Sair da conta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <main id="main">
    <div id="banner" role="alert" hidden></div>
    <header id="topbar">
      <div><h1 id="pageTitle">Painel</h1><div class="sub" id="pageSub"></div></div>
      <button class="btn busca-btn" type="button" data-act="abrirBusca" aria-label="Buscar (Ctrl+K)" title="Buscar em tudo (Ctrl+K)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="busca-rot">Buscar</span><kbd class="busca-kbd">Ctrl K</kbd></button>
      <div class="topbar-actions" id="pageActions"></div>
    </header>
    <div id="view"></div>
  </main>
  <!-- Celular: atalhos fixos embaixo; "Mais" abre o menu completo. -->
  <nav id="tabbar" aria-label="Atalhos">
    <button type="button" data-view="dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/></svg><span>Painel</span></button>
    <button type="button" data-view="leads"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg><span>Leads</span><i class="nav-badge" data-badge="leads" hidden></i></button>
    <button type="button" data-view="tarefas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v16H3zM3 9h18M8 3v4M16 3v4"/></svg><span>Agenda</span><i class="nav-badge" data-badge="tarefas" hidden></i></button>
    <button type="button" data-view="clientes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20a6 6 0 0 1 12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 20a5 5 0 0 0-3-4.6"/></svg><span>Clientes</span></button>
    <button type="button" data-act="abrirMenu" aria-label="Abrir o menu completo" aria-controls="rail" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Mais</span></button>
  </nav>
  <div id="railScrim" data-act="fecharMenu" aria-hidden="true"></div>
</div>
<div id="scrim"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="scrim2"><div id="dialogo" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lembrete" role="status" aria-live="polite"></div>

<!-- Código do sistema, por domínio. Scripts clássicos, executados nesta ordem. -->
<script src="assets/js/core.js"></script>

<script src="assets/js/ui/modal.js"></script>
<script src="assets/js/ui/layout.js"></script>
<script src="assets/js/views/painel.js"></script>
<script src="assets/js/views/leads.js"></script>
<script src="assets/js/views/clientes.js"></script>
<script src="assets/js/views/contratos.js"></script>
<script src="assets/js/views/comissoes.js"></script>
<script src="assets/js/views/carteira.js"></script>
<script src="assets/js/views/agenda.js"></script>
<script src="assets/js/views/despesas.js"></script>
<script src="assets/js/views/vidas.js"></script>
<script src="assets/js/views/equipe.js"></script>
<script src="assets/js/views/relatorios.js"></script>
<script src="assets/js/views/operadoras.js"></script>
<script src="assets/js/views/atividade.js"></script>
<script src="assets/js/views/auditoria.js"></script>
<script src="assets/js/views/documentos.js"></script>
<script src="assets/js/views/config.js"></script>
<script src="assets/js/forms/lead.js"></script>
<script src="assets/js/forms/contrato.js"></script>
<script src="assets/js/forms/cliente.js"></script>
<script src="assets/js/forms/outros.js"></script>
<script src="assets/js/busca.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/acoes.js"></script>
</body>
</html>
